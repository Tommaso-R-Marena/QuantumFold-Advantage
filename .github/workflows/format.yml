name: Format and Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install formatter
        run: |
          pip install --upgrade pip
          pip install black==24.10.0 isort==5.13.2

      - name: Run Black
        run: black src tests --line-length 100

      - name: Run isort
        run: isort src tests --profile black --line-length 100

      - name: Check for changes
        id: git-check
        run: |
          git diff --quiet . || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.git-check.outputs.changed == 'true' && github.event_name == 'push'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git commit -m "style: Auto-format code with Black and isort [skip ci]"
          # Only push if on a branch that allows it, here we assume it's handled by environment or token
