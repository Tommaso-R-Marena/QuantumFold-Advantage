name: Notebook validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-notebooks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10']
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nbformat nbconvert jupyter ipython
      
      - name: Validate notebook JSON structure
        run: |
          python - <<'EOF'
          import nbformat
          import glob
          import sys
          import json
          
          errors = []
          for nb_path in glob.glob('examples/*.ipynb'):
              print(f"Checking {nb_path}...")
              try:
                  with open(nb_path, 'r', encoding='utf-8') as f:
                      data = json.load(f)

                  # Ensure required keys exist for nbformat
                  if 'cells' not in data: data['cells'] = []
                  if 'metadata' not in data: data['metadata'] = {}
                  if 'nbformat' not in data: data['nbformat'] = 4
                  if 'nbformat_minor' not in data: data['nbformat_minor'] = 5

                  nb = nbformat.reads(json.dumps(data), as_version=4)
                  # Minimal validation
                  if not hasattr(nb, 'cells'):
                      errors.append(f"✗ {nb_path}: Missing cells")
                  else:
                      print(f"✓ {nb_path}: Valid")
              except Exception as e:
                  errors.append(f"✗ {nb_path}: {str(e)}")
                  print(f"✗ {nb_path}: Error - {str(e)}")
          
          if errors:
              print(f"\n{len(errors)} notebook(s) failed validation")
              sys.exit(1)
          EOF

  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install nbformat
      - name: Check Python Syntax
        run: |
          python - <<'EOF'
          import nbformat
          import glob
          import ast
          import sys
          
          for nb_path in glob.glob('examples/*.ipynb'):
              try:
                  nb = nbformat.read(nb_path, as_version=4)
                  for i, cell in enumerate(nb.cells):
                      if cell.cell_type == 'code':
                          src = cell.source
                          # filter out magics
                          lines = [l for l in src.splitlines() if not (l.strip().startswith('%') or l.strip().startswith('!'))]
                          code = '\n'.join(lines)
                          if code.strip():
                              try:
                                  ast.parse(code)
                              except SyntaxError as e:
                                  print(f"⚠ {nb_path} cell {i} syntax: {e}")
              except Exception as e:
                  print(f"Error reading {nb_path}: {e}")
          EOF

  metadata-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install nbformat
        run: pip install nbformat
      - name: Check Metadata
        run: |
          python - <<'EOF'
          import nbformat
          import glob
          for nb_path in glob.glob('examples/*.ipynb'):
              try:
                  nb = nbformat.read(nb_path, as_version=4)
                  print(f"✓ {nb_path} metadata: {list(nb.metadata.keys())}")
              except Exception as e:
                  print(f"✗ {nb_path}: {e}")
          EOF

  test-summary:
    runs-on: ubuntu-latest
    needs: [validate-notebooks, syntax-check, metadata-check]
    if: always()
    steps:
      - name: Summary
        run: echo "Notebook validation completed" >> $GITHUB_STEP_SUMMARY
