name: Test Notebooks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run weekly to catch regressions
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  # Static validation - fast and catches most errors
  validate-notebooks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10']
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nbformat
      
      - name: Validate notebook JSON structure
        run: |
          python - <<'EOF'
          import nbformat
          import glob
          import sys
          
          errors = []
          for nb_path in glob.glob('examples/*.ipynb'):
              try:
                  with open(nb_path, 'r', encoding='utf-8') as f:
                      nb = nbformat.read(f, as_version=4)
                  print(f"✓ {nb_path}: Valid JSON structure")
              except Exception as e:
                  errors.append(f"✗ {nb_path}: {str(e)}")
                  print(f"✗ {nb_path}: {str(e)}")
          
          if errors:
              print(f"\n{len(errors)} notebook(s) failed validation")
              sys.exit(1)
          else:
              print(f"\nAll notebooks passed validation!")
          EOF

  # Syntax checking - ensures code is valid Python
  syntax-check:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install nbformat
      
      - name: Extract and check Python syntax
        run: |
          python - <<'EOF'
          import nbformat
          import glob
          import ast
          import sys
          
          errors = []
          
          for nb_path in glob.glob('examples/*.ipynb'):
              with open(nb_path, 'r', encoding='utf-8') as f:
                  nb = nbformat.read(f, as_version=4)
              
              for i, cell in enumerate(nb.cells):
                  if cell.cell_type == 'code':
                      source = cell.source
                      if not source.strip():
                          continue
                      
                      # Filter out shell commands and magics
                      lines = source.splitlines()
                      filtered_lines = [line for line in lines if not line.strip().startswith(('!', '%'))]
                      clean_source = '\n'.join(filtered_lines)
                      
                      if not clean_source.strip():
                          continue

                      try:
                          ast.parse(clean_source)
                      except SyntaxError as e:
                          errors.append(f"{nb_path} cell {i}: {str(e)}")
                          print(f"✗ {nb_path} cell {i}: Syntax error: {e}")
          
          if errors:
              print(f"\n{len(errors)} syntax error(s) found:")
              for error in errors:
                  print(f"  {error}")
              sys.exit(1)
          else:
              print("\n✓ All code cells have valid Python syntax")
          EOF

  # Check notebook metadata
  metadata-check:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install nbformat

      - name: Check Colab compatibility
        run: |
          python - <<'EOF'
          import nbformat
          import glob
          
          for nb_path in glob.glob('examples/*.ipynb'):
              with open(nb_path, 'r', encoding='utf-8') as f:
                  nb = nbformat.read(f, as_version=4)
              
              metadata = nb.get('metadata', {})
              if 'colab' in metadata:
                  print(f"✓ {nb_path}: Has Colab metadata")
              else:
                  print(f"⚠ {nb_path}: No Colab metadata")
          EOF

  # Summary report
  test-summary:
    runs-on: ubuntu-latest
    needs: [validate-notebooks, syntax-check, metadata-check]
    if: always()
    
    steps:
      - name: Generate summary
        run: |
          echo "## Notebook Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Checked notebooks in examples/" >> $GITHUB_STEP_SUMMARY
