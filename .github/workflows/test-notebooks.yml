name: Notebook Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'examples/**/*.ipynb'
      - 'notebooks/**/*.ipynb'
  pull_request:
    paths:
      - 'examples/**/*.ipynb'
      - 'notebooks/**/*.ipynb'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  validate-notebooks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10']
    
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install nbformat
      - name: Validate notebook JSON structure
        run: |
          python - <<'EOF'
          import nbformat
          import glob
          import sys
          errors = []
          for nb_path in glob.glob('examples/*.ipynb'):
              try:
                  with open(nb_path, 'r', encoding='utf-8') as f:
                      nbformat.read(f, as_version=4)
                  print(f"✓ {nb_path}: Valid JSON structure")
              except Exception as e:
                  errors.append(f"✗ {nb_path}: {str(e)}")
                  print(f"✗ {nb_path}: {str(e)}")
          if errors:
              sys.exit(1)
          EOF

  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install nbformat
      - name: Parse and check Python syntax
        run: |
          python - <<'EOF'
          import nbformat
          import glob
          import ast
          import sys
          errors = []
          for nb_path in glob.glob('examples/*.ipynb'):
              with open(nb_path, 'r', encoding='utf-8') as f:
                  nb = nbformat.read(f, as_version=4)
              for i, cell in enumerate(nb.cells):
                  if cell.cell_type == 'code':
                      source = ''.join(cell.source)
                      if not source.strip() or source.strip().startswith(('!', '%')):
                          continue
                      try:
                          ast.parse(source)
                      except SyntaxError as e:
                          errors.append(f"{nb_path} cell {i}: {str(e)}")
                          print(f"✗ {nb_path} cell {i}: Syntax error")
          if errors:
              sys.exit(1)
          EOF

  import-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install nbformat
      - name: Extract import statements
        run: |
          python - <<'EOF'
          import nbformat
          import glob
          import re
          from collections import defaultdict
          imports_by_notebook = defaultdict(set)
          for nb_path in glob.glob('examples/*.ipynb'):
              with open(nb_path, 'r', encoding='utf-8') as f:
                  nb = nbformat.read(f, as_version=4)
              for cell in nb.cells:
                  if cell.cell_type == 'code':
                      source = ''.join(cell.source)
                      for match in re.finditer(r'^import (\S+)', source, re.M):
                          imports_by_notebook[nb_path].add(match.group(1).split('.')[0])
                      for match in re.finditer(r'^from (\S+)', source, re.M):
                          imports_by_notebook[nb_path].add(match.group(1).split('.')[0])
          for nb_path, imports in sorted(imports_by_notebook.items()):
              print(f"{nb_path}: {sorted(list(imports))}")
          EOF

  metadata-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install nbformat
      - name: Check Colab compatibility
        run: |
          python - <<'EOF'
          import nbformat
          import glob
          for nb_path in glob.glob('examples/*.ipynb'):
              with open(nb_path, 'r', encoding='utf-8') as f:
                  nb = nbformat.read(f, as_version=4)
              metadata = nb.get('metadata', {})
              if 'colab' in metadata:
                  print(f"✓ {nb_path}: Has Colab metadata")
          EOF
