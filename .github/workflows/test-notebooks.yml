name: Test Notebooks

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'examples/**/*.ipynb'
      - 'notebooks/**/*.ipynb'
  pull_request:
    paths:
      - 'examples/**/*.ipynb'
      - 'notebooks/**/*.ipynb'
  schedule:
    # Run weekly to catch regressions
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  # Static validation - fast and catches most errors
  validate-notebooks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10']
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nbformat nbconvert jupyter
      
      - name: Validate notebook JSON structure
        run: |
          python - <<'EOF'
          import nbformat
          import glob
          import sys
          
          errors = []
          for nb_path in glob.glob('examples/*.ipynb'):
              try:
                  with open(nb_path, 'r', encoding='utf-8') as f:
                      nb = nbformat.read(f, as_version=4)
                  print(f"✓ {nb_path}: Valid JSON structure")
              except Exception as e:
                  errors.append(f"✗ {nb_path}: {str(e)}")
                  print(f"✗ {nb_path}: {str(e)}")
          
          if errors:
              print(f"\n{len(errors)} notebook(s) failed validation")
              sys.exit(1)
          else:
              print(f"\nAll notebooks passed validation!")
          EOF

  # Syntax checking - ensures code is valid Python
  syntax-check:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install nbformat nbconvert ipython
      
      - name: Extract and check Python syntax
        run: |
          python - <<'EOF'
          import nbformat
          import glob
          import ast
          import sys
          
          errors = []
          
          for nb_path in glob.glob('examples/*.ipynb'):
              with open(nb_path, 'r', encoding='utf-8') as f:
                  nb = nbformat.read(f, as_version=4)
              
              for i, cell in enumerate(nb.cells):
                  if cell.cell_type == 'code':
                      source = ''.join(cell.source)
                      if not source.strip():
                          continue
                      
                      # Skip cells with shell commands
                      if source.strip().startswith('!'):
                          continue
                      
                      # Skip cells with IPython magic
                      if source.strip().startswith('%'):
                          continue
                      
                      try:
                          ast.parse(source)
                      except SyntaxError as e:
                          errors.append(f"{nb_path} cell {i}: {str(e)}")
                          print(f"✗ {nb_path} cell {i}: Syntax error")
          
          if errors:
              print(f"\n{len(errors)} syntax error(s) found:")
              for error in errors:
                  print(f"  {error}")
              sys.exit(1)
          else:
              print("\n✓ All code cells have valid Python syntax")
          EOF

  # Import checking - ensures required packages are available
  import-check:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install minimal dependencies
        run: |
          pip install nbformat
      
      - name: Extract import statements
        run: |
          python - <<'EOF'
          import nbformat
          import glob
          import re
          from collections import defaultdict
          
          imports_by_notebook = defaultdict(set)
          
          for nb_path in glob.glob('examples/*.ipynb'):
              with open(nb_path, 'r', encoding='utf-8') as f:
                  nb = nbformat.read(f, as_version=4)
              
              for cell in nb.cells:
                  if cell.cell_type == 'code':
                      source = ''.join(cell.source)
                      
                      # Find import statements
                      for match in re.finditer(r'^import (\S+)', source, re.M):
                          imports_by_notebook[nb_path].add(match.group(1).split('.')[0])
                      
                      for match in re.finditer(r'^from (\S+)', source, re.M):
                          imports_by_notebook[nb_path].add(match.group(1).split('.')[0])
          
          print("\n📦 Required packages by notebook:\n")
          all_imports = set()
          for nb_path, imports in sorted(imports_by_notebook.items()):
              nb_name = nb_path.split('/')[-1]
              external_imports = [imp for imp in imports if imp not in ['src', 'sys', 'os']]
              if external_imports:
                  print(f"{nb_name}:")
                  for imp in sorted(external_imports):
                      print(f"  - {imp}")
                      all_imports.add(imp)
          
          print(f"\n📊 Total unique packages: {len(all_imports)}")
          print(f"Packages: {', '.join(sorted(all_imports))}")
          EOF

  # Check notebook metadata
  metadata-check:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install nbformat
      
      - name: Check Colab compatibility
        run: |
          python - <<'EOF'
          import nbformat
          import glob
          import json
          
          for nb_path in glob.glob('examples/*.ipynb'):
              with open(nb_path, 'r', encoding='utf-8') as f:
                  nb = nbformat.read(f, as_version=4)
              
              metadata = nb.get('metadata', {})
              
              # Check for GPU settings
              accelerator = metadata.get('accelerator')
              if accelerator:
                  print(f"{nb_path}: Accelerator = {accelerator}")
              
              # Check for Colab metadata
              if 'colab' in metadata:
                  print(f"✓ {nb_path}: Has Colab metadata")
              else:
                  print(f"⚠ {nb_path}: No Colab metadata (may not work in Colab)")
          EOF

  # Summary report
  test-summary:
    runs-on: ubuntu-latest
    needs: [validate-notebooks, syntax-check, import-check, metadata-check]
    if: always()
    
    steps:
      - name: Generate summary
        run: |
          echo "## Notebook Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          results=("validate-notebooks" "syntax-check" "import-check" "metadata-check")
          for job in "${results[@]}"; do
            # We don't have direct access to job results here easily without needs metadata,
            # but we can do a broad check.
            echo "- Job $job: Check logs for details" >> $GITHUB_STEP_SUMMARY
          done
