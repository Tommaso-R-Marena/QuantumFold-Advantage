name: Notebook Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  metadata-check:
    name: metadata-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install nbformat
        run: pip install nbformat

      - name: Run metadata check
        run: |
          python - <<'INNEREOF'
          import nbformat
          import glob
          import sys
          
          errors = []
          for nb_path in glob.glob('examples/*.ipynb'):
              try:
                  with open(nb_path, 'r', encoding='utf-8') as f:
                      nb = nbformat.read(f, as_version=4)
                  if 'metadata' not in nb:
                      errors.append(f"{nb_path} missing metadata")
                      print(f"✗ {nb_path}: Missing metadata")
                  else:
                      print(f"✓ {nb_path}: Has metadata")
              except Exception as e:
                  errors.append(f"{nb_path}: {str(e)}")
                  print(f"✗ {nb_path}: {str(e)}")
          
          if errors:
              sys.exit(1)
          INNEREOF

  import-check:
    name: import-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install nbformat
        run: pip install nbformat

      - name: Run import check
        run: |
          python - <<'INNEREOF'
          import nbformat
          import glob
          
          for nb_path in glob.glob('examples/*.ipynb'):
              with open(nb_path, 'r', encoding='utf-8') as f:
                  nb = nbformat.read(f, as_version=4)
              
              for cell in nb.cells:
                  if cell.cell_type == 'code':
                      pass
          print("Notebook structure check passed")
          INNEREOF

  syntax-check:
    name: syntax-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install nbformat
        run: pip install nbformat

      - name: Run syntax check
        run: |
          python - <<'INNEREOF'
          import nbformat
          import glob
          import ast
          import sys
          
          errors = []
          for nb_path in glob.glob('examples/*.ipynb'):
              with open(nb_path, 'r', encoding='utf-8') as f:
                  nb = nbformat.read(f, as_version=4)
              
              for i, cell in enumerate(nb.cells):
                  if cell.cell_type == 'code':
                      source = cell.source
                      if isinstance(source, list):
                          source = ''.join(source)
                      
                      if not source.strip() or source.strip().startswith(('!', '%')):
                          continue
                      
                      try:
                          ast.parse(source)
                      except SyntaxError as e:
                          errors.append(f"{nb_path} cell {i}: {str(e)}")
          
          if errors:
              for err in errors:
                  print(f"✗ {err}")
              sys.exit(1)
          print("✓ Syntax check passed")
          INNEREOF
